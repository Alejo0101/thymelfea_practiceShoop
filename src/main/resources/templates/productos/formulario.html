<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Producto</title></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1 th:text="${producto.id == null} ? 'Nuevo producto' : 'Editar producto'">Producto</h1>
<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
  <input type="hidden" th:field="*{id}">
  <p>Nombre:<br><input type="text" th:field="*{nombre}" required></p>
  <p>Descripción:<br><textarea th:field="*{descripcion}" rows="3"></textarea></p>
  <p>Precio:<br><input type="number" step="0.01" th:field="*{precio}" required></p>
  <p>Stock:<br><input type="number" th:field="*{stock}" required></p>
  <p>Categoría:<br><select th:field="*{categoria}"><option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option></select></p>
  <button type="submit">Guardar</button>
  <a th:href="@{/productos}">Cancelar</a>
</form>
</body></html>
