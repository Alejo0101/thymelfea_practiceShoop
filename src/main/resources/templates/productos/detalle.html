<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Detalle del producto</title></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1 th:text="${producto.nombre}">Nombre</h1>
<p th:text="${producto.descripcion}">Descripción</p>
<ul>
  <li>Categoría: <span th:text="${producto.categoria}"></span></li>
  <li>Precio: $<span th:text="${#numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}"></span></li>
  <li>Stock: <span th:text="${producto.stock}"></span></li>
</ul>
<p th:if="${producto.stock == 0}" style="color:red">Producto agotado</p>
<a th:href="@{/productos}">Volver al listado</a>
</body></html>
