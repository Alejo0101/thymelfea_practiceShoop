<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Catálogo de productos</title></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<h1>Catálogo de productos</h1>
<p th:if="${mensaje}" th:text="${mensaje}" style="color:green"></p>
<form th:action="@{/productos}" method="get">
  <input type="text" name="nombre" th:value="${nombre}" placeholder="Buscar por nombre">
  <button type="submit">Buscar</button>
  <a th:href="@{/productos}">Limpiar</a>
</form>
<p><a sec:authorize="hasAnyRole('VENDEDOR','ADMIN')" th:href="@{/productos/nuevo}">+ Nuevo producto</a></p>
<table border="1" cellpadding="6">
  <thead><tr><th>#</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
  <tbody>
    <tr th:each="p, estado : ${productos}">
      <td th:text="${estado.count}">1</td>
      <td th:text="${p.nombre}">Nombre</td>
      <td th:text="${p.categoria}">Categoría</td>
      <td th:text="${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">0</td>
      <td th:text="${p.stock}" th:classappend="${p.stock < 5} ? 'bajo'">0</td>
      <td>
        <a th:href="@{/productos/{id}(id=${p.id})}">Ver</a>
        <span sec:authorize="hasAnyRole('VENDEDOR','ADMIN')">
          | <a th:href="@{/productos/{id}/editar(id=${p.id})}">Editar</a>
          <form th:action="@{/productos/{id}/eliminar(id=${p.id})}" method="post" style="display:inline">
            <button type="submit">Eliminar</button>
          </form>
        </span>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(productos)}"><td colspan="6">No hay productos para mostrar.</td></tr>
  </tbody>
</table>
</body></html>
